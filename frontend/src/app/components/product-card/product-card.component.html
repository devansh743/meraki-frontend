<div class="product-card group" *ngIf="cake">
    <div class="product-img-container relative bg-slate-50">
        <img [src]="cake.image" class="product-img" [alt]="cake.name">
        <div class="absolute top-3 left-3 glass px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest text-meraki-dark shadow-sm">{{ cake.category || 'Premium' }}</div>
        
        <!-- Like Button -->
        <button class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-slate-400 hover:text-rose-500 hover:bg-white transition-all duration-300 shadow-sm">
            <i class="fa-regular fa-heart"></i>
        </button>
    </div>
    
    <div class="p-5">
        <div class="flex justify-between items-start mb-1.5">
            <h4 class="font-brand text-lg font-black text-slate-800 tracking-tight leading-tight">{{ cake.name }}</h4>
            <div class="text-meraki text-[10px] font-bold flex items-center gap-1">
                <i class="fa-solid fa-star text-[8px]"></i> 4.9
            </div>
        </div>
        <p class="text-slate-400 text-xs mb-4 line-clamp-2 leading-relaxed font-medium">{{ cake.description }}</p>
        
        <div class="flex gap-1.5 mb-5">
            <button *ngFor="let v of cake.variants" (click)="updateVariant(v)" 
                    class="flex-1 py-1 text-[10px] font-bold border rounded-lg transition-all duration-300"
                    [ngClass]="selectedWeight === v.weight ? 'bg-teal-50 text-meraki border-meraki shadow-sm' : 'bg-white text-slate-400 border-slate-100 hover:border-slate-300'">
                {{ v.weight }}
            </button>
        </div>
        
        <div class="flex justify-between items-center pt-4 border-t border-slate-50 gap-4">
            <div class="flex-shrink-0">
                <p class="text-[9px] text-slate-300 font-bold uppercase tracking-tighter mb-0.5">Price</p>
                <div class="flex items-baseline gap-0.5">
                    <span class="text-xs font-bold text-slate-400">₹</span>
                    <span class="font-brand text-xl font-black text-slate-900">{{ currentPrice }}</span>
                </div>
            </div>
            
            <div class="flex gap-2 flex-1 justify-end">
                <!-- Call Button -->
                <button (click)="callOwner()" class="w-9 h-9 rounded-xl border border-slate-100 flex items-center justify-center text-slate-400 hover:text-meraki hover:border-meraki hover:bg-teal-50 transition-all duration-300 shadow-sm">
                    <i class="fa-solid fa-phone text-sm"></i>
                </button>
                
                <!-- WhatsApp Button -->
                <a [href]="getWhatsAppLink()" target="_blank" class="flex-1 h-9 rounded-xl bg-[#25D366] text-white flex items-center justify-center gap-2 hover:bg-[#128C7E] hover:shadow-lg hover:shadow-green-500/30 transition-all duration-300 shadow-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span class="text-[10px] font-black uppercase tracking-tight">Order</span>
                </a>
            </div>
        </div>
    </div>
</div>
