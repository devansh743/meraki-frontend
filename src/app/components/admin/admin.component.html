<div class="admin-page">
    <div class="admin-card">
        <div class="admin-header">
            <h2>Inventory Manager</h2>
            <p>Add new sweet creations to the Meraki menu.</p>
        </div>

        <form class="admin-form" (ngSubmit)="submitCake()">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Cake Name</label>
                    <input [(ngModel)]="cake.name" name="name" placeholder="e.g. Velvet Sky Bloom" required>
                </div>

                <div class="form-group full-width">
                    <label>Description</label>
                    <input [(ngModel)]="cake.description" name="description" placeholder="Short appetizing description..." required>
                </div>

                <div class="form-group">
                    <label>Main Category</label>
                    <select [(ngModel)]="cake.type" name="type">
                        <option value="Cake">Cake</option>
                        <option value="Pastry">Pastry</option>
                        <option value="Cup Cake">Cup Cake</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sub Category</label>
                    <select [(ngModel)]="cake.category" name="category">
                        <option value="General">General</option>
                        <option value="Birthday">Birthday</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="New Born">New Born</option>
                        <option value="Children Special">Children Special</option>
                        <option value="Festive Special">Festive Special</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price (250g)</label>
                    <input [(ngModel)]="cake.variants[0].price" name="p250" type="number" placeholder="e.g. 349">
                </div>

                <div class="form-group">
                    <label>Price (500g)</label>
                    <input [(ngModel)]="cake.variants[1].price" name="p500" type="number" placeholder="e.g. 599">
                </div>

                <div class="form-group">
                    <label>Price (1kg)</label>
                    <input [(ngModel)]="cake.variants[2].price" name="p1kg" type="number" placeholder="e.g. 1099">
                </div>

                <div class="form-group full-width">
                    <label>Image URL</label>
                    <input [(ngModel)]="cake.image" name="img" placeholder="https://..." required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Publish to Website <i class="fa-solid fa-cloud-arrow-up"></i>
            </button>

            <div *ngIf="message" class="status-msg" [ngClass]="isError ? 'error' : 'success'">
                {{ message }}
            </div>
        </form>
    </div>
</div>
